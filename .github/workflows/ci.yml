name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup-go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      - name: build
        run: make build

      - name: test
        run: make test

      - name: test-race
        run: make test-race

      - name: lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.13

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: coverage gate
        run: make cover-gate

  # Dogfood: run SCG against this repository's own lockfile.
  #
  # The committed scg.lock was signed by a discarded ephemeral key and would
  # have failed verification for some time, and nothing here would have said
  # so. Verifying our own supply chain is the cheapest possible test that the
  # product actually works end to end.
  #
  # Runs on main and on a schedule rather than on every pull request: the
  # anonymous tier is 20 requests an hour per IP, and GitHub-hosted runners
  # share address space, so a busy PR queue would rate-limit itself. Forks
  # have no API key and are skipped rather than failing.
  dogfood:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup-go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      - name: build
        run: make build

      # A finding (exit 1) fails the job. An SCG operational failure (exit 2:
      # platform unreachable, budget spent, data past its freshness budget)
      # is a warning here: it says nothing about this repository and must not
      # block merging CLI changes. The scheduled dogfood workflow is the hard
      # canary for the platform.
      - name: verify our own lockfile
        env:
          SCG_API_KEY: ${{ secrets.SCG_API_KEY }}
        run: |
          set +e
          ./scg check --verbose
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::scg check could not complete (exit 2): SCG operational failure, not a finding"
            exit 0
          fi
          exit "$code"

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: trivy-scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
