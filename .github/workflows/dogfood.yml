# Scheduled canary: verifies our own lockfile against the live platform every
# six hours and fails on any non-zero exit, including exit 2. A red run here
# means the platform cannot vouch for what it serves (unreachable, budget
# spent, data past its freshness budget) and somebody should look at
# https://api.scg.data-insights.ai/v1/status. CI on pushes only warns on
# exit 2 so that CLI changes are not blocked by platform state.
name: dogfood
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: build
        run: make build

      - name: verify our own lockfile
        env:
          SCG_API_KEY: ${{ secrets.SCG_API_KEY }}
        run: ./scg check --verbose
