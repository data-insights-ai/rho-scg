# Scheduled canary: verifies our own lockfile against the live platform every
# six hours and fails on any non-zero exit, including exit 2. A red run here
# means the platform cannot vouch for what it serves (unreachable, budget
# spent, data past its freshness budget) and somebody should look at
# https://scg.data-insights.ai/v1/status. CI on pushes only warns on
# exit 2 so that CLI changes are not blocked by platform state.
name: dogfood
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup-go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      - name: build
        run: make build

      - name: verify our own lockfile
        env:
          SCG_API_KEY: ${{ secrets.SCG_API_KEY }}
        # A deploy restarts the platform for about a minute; a canary that
        # lands in that minute sees "platform unavailable" (exit 2), which
        # is an outage of ours, not a finding. One retry after 90 seconds
        # tells the two apart; a second exit 2 is the alarm this job is for.
        run: |
          set +e
          ./scg check --verbose
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::notice::exit 2 (platform unavailable or stale); retrying once in 90 s"
            sleep 90
            ./scg check --verbose
            code=$?
          fi
          exit "$code"
