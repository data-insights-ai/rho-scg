name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: write
  # Required for cosign keyless signing: the workflow's OIDC token is the
  # identity the signature is bound to.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup-go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      - name: test
        run: make test

      - name: cross-compile
        run: |
          VERSION=${GITHUB_REF_NAME}
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              echo "Building scg-${GOOS}-${GOARCH}..."
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o dist/scg-${GOOS}-${GOARCH} ./cmd/scg/
            done
          done

      - name: checksums
        run: |
          cd dist
          sha256sum scg-* > checksums.txt
          cat checksums.txt

      # Sign the checksum file with sigstore keyless signing.
      #
      # The checksums alone are served from the same origin as the binaries, so
      # whoever can replace one can replace the other. A cosign signature bound
      # to this workflow's OIDC identity is what makes the checksums evidence
      # rather than a convenience.
      - name: install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: sign checksums
        run: |
          cd dist
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      # SLSA build provenance: GitHub attests which workflow, commit and
      # runner produced each binary. Verify with
      #   gh attestation verify scg-linux-amd64 --owner data-insights-ai
      - name: attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/scg-*
            dist/checksums.txt

      - name: github release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/scg-*
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
          generate_release_notes: true
