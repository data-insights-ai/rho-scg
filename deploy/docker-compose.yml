services:
  traefik:
    image: "traefik:v2.11"
    container_name: scg-traefik
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: 1.45
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@data-insights.ai"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/letsencrypt:/letsencrypt"
    networks:
      - scg-net
  scg-web:
    image: "nginx:alpine"
    container_name: scg-web
    restart: unless-stopped
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      - "./install.sh:/usr/share/nginx/html/install.sh:ro"
      - "./releases:/usr/share/nginx/html/releases:ro"
    labels:
      traefik.enable: true
      traefik.http.routers.scg.rule: "Host(`scg.data-insights.ai`)"
      traefik.http.routers.scg.entrypoints: websecure
      traefik.http.routers.scg.tls.certresolver: letsencrypt
      traefik.http.services.scg.loadbalancer.server.port: 80
    networks:
      - scg-net
networks:
  scg-net:
    driver: bridge
