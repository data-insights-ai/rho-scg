server {
    listen 80;
    server_name scg.bds421.com;

    root /usr/share/nginx/html;

    # install.sh at root
    location = /install.sh {
        default_type text/plain;
        add_header Content-Disposition "inline";
    }

    # Release binaries
    location /releases/ {
        autoindex on;
        autoindex_exact_size off;
        add_header Cache-Control "public, max-age=3600";
    }

    # Landing page
    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html><head><title>SCG - Supply Chain Guardian</title>
<style>body{font-family:system-ui;max-width:700px;margin:80px auto;padding:0 20px;color:#333}
code{background:#f4f4f4;padding:2px 8px;border-radius:4px}
h1{color:#1a1a1a}a{color:#0066cc}</style></head>
<body><h1>Supply Chain Guardian</h1>
<p>Prevent supply chain attacks in CI/CD pipelines.</p>
<h2>Install</h2>
<pre><code>curl -sSL https://scg.bds421.com/install.sh | sh</code></pre>
<h2>Links</h2>
<ul>
<li><a href="https://github.com/bds421/supply-chain-guardian">Source Code</a></li>
<li><a href="/releases/">Release Binaries</a></li>
<li><a href="/install.sh">Install Script</a></li>
</ul>
</body></html>';
    }

    # Health check
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
