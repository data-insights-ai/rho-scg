name: ci
on:
  push:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Verifies scg.lock against the platform: the pinned SHA of every
      # action, including scg-demo-action@v1. A moved tag is exit 1.
      - uses: data-insights-ai/rho-scg@v0.3.0
        with:
          mode: check
          version: v0.3.0
        env:
          SCG_API_KEY: ${{ secrets.SCG_API_KEY }}
      - uses: data-insights-ai/scg-demo-action@v1
